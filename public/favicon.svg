<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d44638"/>
      <stop offset="100%" stop-color="#a83226"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- M: 左右各留 12px 边距，完美居中于 viewBox 中心 x=32 -->
  <!-- 原始路径中心 cx=29，右移 +3 使 cx=32 -->
  <path d="M20,47 L20,21 L32,35 L44,21 L44,47 L50,47 L50,15 L32,33 L14,15 L14,47 Z"
        fill="white" filter="url(#s)" opacity="0.95"/>
  <!-- AI 徽章: 居中于 M 的 V 槽 (cx=32) -->
  <circle cx="32" cy="31" r="7" fill="white" stroke="#d44638" stroke-width="1.5"/>
  <text x="32" y="31" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="7.5"
        font-weight="800" fill="#d44638" letter-spacing="-0.3">AI</text>
</svg>
