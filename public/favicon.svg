<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a38"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <text x="32" y="30" text-anchor="middle" dominant-baseline="middle"
        font-family="'Inter', 'Noto Sans SC', system-ui, sans-serif"
        font-size="32" font-weight="800" fill="url(#accent)" filter="url(#shadow)">M</text>
  <circle cx="32" cy="46" r="8" fill="url(#accent)" opacity="0.18" stroke="url(#accent)" stroke-width="0.8"/>
  <text x="32" y="46" text-anchor="middle" dominant-baseline="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-size="6" font-weight="700" fill="url(#accent)" letter-spacing="0.05em">AI</text>
</svg>
