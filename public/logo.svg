<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d15a54"/>
      <stop offset="100%" stop-color="#a1302e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c987"/>
      <stop offset="100%" stop-color="#c9a24a"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- M letter -->
  <path d="M20 47 L20 21 L32 35 L44 21 L44 47 L50 47 L50 15 L32 33 L14 15 L14 47 Z"
        fill="white" filter="url(#s)" opacity="0.95"/>
  <!-- Cat silhouette sitting in the V of the M -->
  <g transform="translate(32,44)">
    <!-- Cat body (sitting) -->
    <ellipse cx="0" cy="3" rx="4" ry="4.5" fill="url(#gold)" stroke="#8a6a28" stroke-width="0.8"/>
    <!-- Cat head (round) -->
    <circle cx="0" cy="-3" r="4.5" fill="url(#gold)" stroke="#8a6a28" stroke-width="0.8"/>
    <!-- Left ear -->
    <path d="M-4 -3 L-5.5 -7 L-2 -5 Z" fill="url(#gold)" stroke="#8a6a28" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Right ear -->
    <path d="M4 -3 L5.5 -7 L2 -5 Z" fill="url(#gold)" stroke="#8a6a28" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Tail (curled to right) -->
    <path d="M3.5 4 Q6 3.5 6.5 1 Q6.8 -1 5 -1.5" fill="none" stroke="#c9a24a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-1.5" cy="-3.5" r="0.5" fill="#3a2510"/>
    <circle cx="1.5" cy="-3.5" r="0.5" fill="#3a2510"/>
    <!-- Nose -->
    <path d="M-0.5 -2 L0.5 -2 L0 -1.5 Z" fill="#3a2510"/>
    <!-- Whiskers (left) -->
    <line x1="-3" y1="-2.5" x2="-5.5" y2="-2.8" stroke="#c9a24a" stroke-width="0.4" stroke-linecap="round"/>
    <line x1="-3" y1="-1.8" x2="-5.5" y2="-1.5" stroke="#c9a24a" stroke-width="0.4" stroke-linecap="round"/>
    <!-- Whiskers (right) -->
    <line x1="3" y1="-2.5" x2="5.5" y2="-2.8" stroke="#c9a24a" stroke-width="0.4" stroke-linecap="round"/>
    <line x1="3" y1="-1.8" x2="5.5" y2="-1.5" stroke="#c9a24a" stroke-width="0.4" stroke-linecap="round"/>
  </g>
</svg>
