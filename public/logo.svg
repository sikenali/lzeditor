<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a38"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- M 字母 -->
  <text x="64" y="54" text-anchor="middle" dominant-baseline="middle"
        font-family="'Inter', 'Noto Sans SC', system-ui, sans-serif"
        font-size="62" font-weight="800" fill="url(#accent)" filter="url(#shadow)">M</text>
  <!-- 下方小圆圈 + AI -->
  <circle cx="64" cy="88" r="16" fill="url(#accent)" opacity="0.18" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="64" y="88" text-anchor="middle" dominant-baseline="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-size="12" font-weight="700" fill="url(#accent)" letter-spacing="0.05em">AI</text>
</svg>
