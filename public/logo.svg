<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d44638"/>
      <stop offset="100%" stop-color="#a83226"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- M — perfectly centered in 64×64 viewBox -->
  <!-- M bounds: x=11~53 (center=32), y=14~50 (center=32) -->
  <path d="M11,50 L11,22 L26,38 L41,22 L41,50 L47,50 L47,14 L26,34 L5,14 L5,50 Z"
        fill="white" filter="url(#s)" opacity="0.95"/>
  <!-- AI badge centered in M's V notch -->
  <circle cx="26" cy="34" r="7" fill="white" stroke="#d44638" stroke-width="1.5"/>
  <text x="26" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="7.5"
        font-weight="800" fill="#d44638" letter-spacing="-0.3">AI</text>
</svg>