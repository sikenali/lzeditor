<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d44638"/>
      <stop offset="100%" stop-color="#a83226"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- M letter centered in viewBox — shifted +3 right, +1 down from original -->
  <path d="M17,47 L17,21 L29,35 L41,21 L41,47 L47,47 L47,15 L29,33 L11,15 L11,47 Z"
        fill="white" filter="url(#s)" opacity="0.95"/>
  <!-- AI badge centered in M's V notch (M visual center: cx=29, cy=31) -->
  <circle cx="29" cy="31" r="7" fill="white" stroke="#d44638" stroke-width="1.5"/>
  <text x="29" y="31" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="7.5"
        font-weight="800" fill="#d44638" letter-spacing="-0.3">AI</text>
</svg>