<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#1a1209"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 圆角方形背景 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- M 字母：居中偏上 -->
  <text x="64" y="58" text-anchor="middle" dominant-baseline="middle"
        font-family="'Noto Serif SC', 'Source Han Serif SC', serif"
        font-size="68" font-weight="700" fill="#f5f0e8" filter="url(#shadow)">M</text>
  <!-- 猫咪剪影：居中在 M 下方 -->
  <g transform="translate(64, 96)" fill="#c9a96e" opacity="0.9">
    <!-- 身体 -->
    <ellipse cx="0" cy="4" rx="14" ry="11"/>
    <!-- 左耳 -->
    <polygon points="-12,-4 -16,-16 -5,-8"/>
    <!-- 右耳 -->
    <polygon points="12,-4 16,-16 5,-8"/>
    <!-- 左眼 -->
    <ellipse cx="-5" cy="2" rx="2.2" ry="2.5" fill="#1a1209"/>
    <!-- 右眼 -->
    <ellipse cx="5" cy="2" rx="2.2" ry="2.5" fill="#1a1209"/>
    <!-- 鼻子 -->
    <polygon points="0,7 -2,9 2,9"/>
    <!-- 尾巴 -->
    <path d="M14,6 Q22,2 20,-6 Q18,-12 12,-10" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
