name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.9.0)'
        required: true
        default: '0.9.0'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Windows: 安装 C++ Build Tools（electron-builder 需要） ──
      - name: Setup Visual C++ Build Tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 跳过 npm ci 的 build 脚本：better-sqlite3 由 electron-builder @electron/rebuild 处理
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      # ── macOS: 安装 setuptools（Python 3.12+ 移除了 distutils） ──
      - name: Install setuptools (macOS)
        if: runner.os == 'macOS'
        run: python3 -m pip install setuptools --break-system-packages

      # ── Windows: 配置 node-gyp 使用 MSBuild ──
      - name: Configure node-gyp (Windows)
        if: runner.os == 'Windows'
        run: npm config set msbuild_path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"

      - name: Build Vite app
        run: npm run build

      - name: Compile Electron
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Publish (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}

      - name: Build & Publish (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}

      - name: Build & Publish (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb appimage --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}

      - name: Build LPK
        if: runner.os == 'Linux'
        run: |
          npm install -g @lazycatcloud/lzc-cli
          cd lzc
          export LPK_VERSION="${VERSION#v}"
          bash package.sh
        env:
          VERSION: ${{ env.VERSION }}

      - name: Upload LPK artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lpk
          path: lzc/output*.lpk
          retention-days: 7

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download LPK artifact
        uses: actions/download-artifact@v4
        with:
          name: lpk

      - name: Create or Update Release
        run: |
          # 检查是否已存在草稿 release
          EXISTING=$(gh release list --repo ${{ github.repository }} --limit 10 --json tagName,isDraft --jq ".[] | select(.tagName == \"v${{ steps.version.outputs.VERSION }}\" and .isDraft == true) | .tagName" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh release edit "$EXISTING" --draft=false --title "v${{ steps.version.outputs.VERSION }}" --notes "## 更新内容\n\n- 版本 ${{ steps.version.outputs.VERSION }}\n\n## 下载\n\n- Windows: lzeditor-${{ steps.version.outputs.VERSION }}-win-setup.exe\n- macOS Intel: lzeditor-${{ steps.version.outputs.VERSION }}-mac-x64.dmg\n- macOS Apple Silicon: lzeditor-${{ steps.version.outputs.VERSION }}-mac-arm64.dmg\n- Linux deb: lzeditor-${{ steps.version.outputs.VERSION }}-linux-amd64.deb\n- Linux AppImage: lzeditor-${{ steps.version.outputs.VERSION }}-linux-x86_64.AppImage\n- LazyCat Cloud: cloud.lazycat.app.lazycateditor-${{ steps.version.outputs.VERSION }}.lpk"
            echo "✅ Release 已更新: $EXISTING"
          else
            gh release create "v${{ steps.version.outputs.VERSION }}" \
              --title "v${{ steps.version.outputs.VERSION }}" \
              --notes "## 更新内容\n\n- 版本 ${{ steps.version.outputs.VERSION }}" \
              --draft
            echo "✅ 草稿 Release 已创建: v${{ steps.version.outputs.VERSION }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload LPK to Release
        run: |
          LPK_FILE=$(ls lzc/output*.lpk 2>/dev/null | head -1)
          if [ -n "$LPK_FILE" ]; then
            gh release upload "v${{ steps.version.outputs.VERSION }}" "$LPK_FILE" --clobber
            echo "✅ LPK 已上传: $LPK_FILE"
          else
            echo "⚠️ 未找到 LPK 文件"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 构建并发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows**: lzeditor-${{ steps.version.outputs.VERSION }}-win-setup.exe" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS Intel**: lzeditor-${{ steps.version.outputs.VERSION }}-mac-x64.dmg" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS Apple Silicon**: lzeditor-${{ steps.version.outputs.VERSION }}-mac-arm64.dmg" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux deb**: lzeditor-${{ steps.version.outputs.VERSION }}-linux-amd64.deb" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux AppImage**: lzeditor-${{ steps.version.outputs.VERSION }}-linux-x86_64.AppImage" >> $GITHUB_STEP_SUMMARY
          echo "- **LazyCat Cloud**: cloud.lazycat.app.lazycateditor-${{ steps.version.outputs.VERSION }}.lpk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [点击下载](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }})" >> $GITHUB_STEP_SUMMARY
