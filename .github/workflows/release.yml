name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── macOS: Python 3.12 修复 node-gyp distutils 缺失问题 ──
      - name: Setup Python 3.12 (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set Python for node-gyp (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PYTHON=$(which python)" >> $GITHUB_ENV
          echo "NODE_GYP_FORCE_PYTHON=$(which python)" >> $GITHUB_ENV

      # ── Windows: 安装 C++ Build Tools ──
      - name: Setup Visual C++ Build Tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Vite app
        run: npm run build

      - name: Compile Electron
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Publish (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb appimage --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build LPK
        if: runner.os == 'Linux'
        run: |
          npm install -g @lazycatcloud/lzc-cli
          cd lzc
          bash package.sh
        env:
          LPK_VERSION: ${{ github.ref_name }}

      - name: Upload LPK artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lpk
          path: lzc/output*.lpk

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download LPK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: lpk

      - name: Publish Draft Release
        run: |
          DRAFT_RELEASE=$(gh release list --repo ${{ github.repository }} --json tagName,isDraft --jq '.[] | select(.tagName == "${{ steps.version.outputs.VERSION }}" and .isDraft == true) | .tagName' 2>/dev/null || true)
          if [ -n "$DRAFT_RELEASE" ]; then
            gh release edit "$DRAFT_RELEASE" --draft=false
            echo "✅ Release $DRAFT_RELEASE 已发布"
          else
            echo "⚠️ 未找到草稿 Release，手动检查: https://github.com/${{ github.repository }}/releases"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload LPK to Release
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.VERSION != ''
        run: |
          LPK_FILE=$(ls lzc/output*.lpk 2>/dev/null || ls *.lpk 2>/dev/null)
          if [ -n "$LPK_FILE" ]; then
            gh release upload "${{ steps.version.outputs.VERSION }}" "$LPK_FILE" --clobber
            echo "✅ LPK: $LPK_FILE 已上传"
          else
            echo "⚠️ 未找到 LPK 文件"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 构建并发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows**: lzeditor-${{ steps.version.outputs.VERSION }}-win-setup.exe" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS Intel**: lzeditor-${{ steps.version.outputs.VERSION }}-mac-x64.dmg" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS Apple Silicon**: lzeditor-${{ steps.version.outputs.VERSION }}-mac-arm64.dmg" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux deb**: lzeditor-${{ steps.version.outputs.VERSION }}-linux-amd64.deb" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux AppImage**: lzeditor-${{ steps.version.outputs.VERSION }}-linux-x86_64.AppImage" >> $GITHUB_STEP_SUMMARY
          echo "- **LazyCat Cloud**: $(ls lzc/output*.lpk 2>/dev/null || echo 'LPK 构建中...')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [点击下载](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION }})" >> $GITHUB_STEP_SUMMARY
