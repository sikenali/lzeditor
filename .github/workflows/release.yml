name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            target: x64
          - os: windows-latest
            platform: win
            target: x64
          - os: macos-13
            platform: mac
            target: x64
          - os: macos-latest
            platform: mac
            target: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Linux deb + AppImage)
        if: matrix.platform == 'linux'
        run: |
          npx electron-builder \
            --linux deb appimage \
            --x64 \
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (Windows)
        if: matrix.platform == 'win'
        run: |
          npx electron-builder \
            --win \
            --x64 \
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (macOS x64)
        if: matrix.platform == 'mac' && matrix.target == 'x64'
        run: |
          npx electron-builder \
            --mac \
            --x64 \
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (macOS ARM64)
        if: matrix.platform == 'mac' && matrix.target == 'arm64'
        run: |
          npx electron-builder \
            --mac \
            --arm64 \
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: runner.os != 'Linux' || matrix.target == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: lzeditor-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            release/**/*
            !**/latest.yml
            !**/builder-effective-config.yaml

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "lzeditor $TAG" \
            --notes "Auto-generated release for $TAG" \
            release-artifacts/**/*
