name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.9.0)'
        required: true
        default: '0.9.0'

permissions:
  contents: write
  actions: read

jobs:
  build-electron-win:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Compile Electron
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Publish
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-electron-mac:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Compile Electron
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Publish
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-electron-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Compile Electron
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Publish
        run: npx electron-builder --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-lpk:
    name: Build LPK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Install lzc-cli
        run: npm install -g @lazycatcloud/lzc-cli

      - name: Build LPK
        run: |
          cd lzc
          export LPK_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          bash package.sh
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload LPK to Release
        run: |
          VERSION_NUM="${{ github.event.inputs.version || github.ref_name }}"
          VERSION_NUM="${VERSION_NUM#v}"
          LPK_FILE="lzc/cloud.lazycat.app.lazycateditor-${VERSION_NUM}.lpk"
          if [ -f "$LPK_FILE" ]; then
            gh release create "v${VERSION_NUM}" --title "v${VERSION_NUM}" --notes "## 更新内容\n\n- 版本 ${VERSION_NUM}" --draft
            gh release upload "v${VERSION_NUM}" "$LPK_FILE" --clobber
            echo "✅ LPK 已上传"
          else
            echo "⚠️ 未找到 LPK 文件"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
